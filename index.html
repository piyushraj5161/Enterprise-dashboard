<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enterprise Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topbar">
    <h2>Enterprise Dashboard</h2>
    <button id="themeBtn">Toggle Theme</button>
  </header>

  <main class="container">
    <h1>Dashboard Overview</h1>
    <p>Welcome to your responsive dashboard.</p>

    <section class="stats">
      <div class="card">
        <h3>Total Users</h3>
        <p>12,450</p>
      </div>
      <div class="card">
        <h3>Revenue</h3>
        <p>₹85,000</p>
      </div>
      <div class="card">
        <h3>Orders</h3>
        <p>1,250</p>
      </div>
      <div class="card">
        <h3>Growth</h3>
        <p>24.5%</p>
      </div>
    </section>

    <section class="panel">
      <h2>Recent Activity</h2>
      <p>New users registered successfully.</p>
      <p>Monthly report updated.</p>
      <p>New orders received.</p>
    </section>
  </main>

  <script>
    document.getElementById("themeBtn").onclick = function () {
      document.body.classList.toggle("dark");
    };
  </script>

</body>
</html>
